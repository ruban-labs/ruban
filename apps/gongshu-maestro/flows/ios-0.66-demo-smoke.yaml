appId: com.rubanlabs.mobile.gongshu.rn066.debug
---
# Gongshu app-shell smoke (ios, era 0.66). Maestro 2.x syntax.
# Text-based selectors on purpose: RN exposes testID to the automation
# hierarchy inconsistently across eras/architectures (Paper vs Fabric),
# while visible product labels are stable everywhere.
- launchApp:
    clearState: true
- setOrientation: portrait
- extendedWaitUntil:
    visible:
      text: "Components"
    timeout: 120000
- assertVisible:
    text: "Button"
- assertVisible:
    text: "Playground"
- tapOn:
    text: "Button"
- extendedWaitUntil:
    visible:
      text: "← COMPONENTS"
    timeout: 20000
- assertNotVisible:
    text: "Playground"
- assertNotVisible:
    text: "Settings"
- tapOn:
    text: "← COMPONENTS"
- extendedWaitUntil:
    visible:
      text: "Components"
    timeout: 20000
- tapOn:
    text: "Playground"
- extendedWaitUntil:
    visible:
      text: "PLAYGROUND"
    timeout: 20000
- assertVisible:
    text: "LIGHT"
- assertVisible:
    text: "TYPE"
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 20000
- assertVisible:
    text: "Appearance"
- scrollUntilVisible:
    element:
      text: "Build & matrix"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Build & matrix"
- extendedWaitUntil:
    visible:
      text: "Build & Matrix"
    timeout: 20000
- assertVisible:
    text: "HERMES"
- tapOn:
    text: "CLOSE"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 20000
