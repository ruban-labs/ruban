appId: com.rubanlabs.mobile.debug
---
# The iOS 18 simulator does not reliably relaunch a stopped app through
# Maestro's custom-scheme openLink action. Deep links remain covered by the
# Android latest flow and both older iOS flows; this flow validates the latest
# app through the same user-visible in-app navigation paths.
- launchApp:
    clearState: true
- setOrientation: portrait
- extendedWaitUntil:
    visible:
      text: "Portfolio"
    timeout: 120000
- assertVisible:
    text: "Create a wallet"
- assertVisible:
    text: "Network, Ethereum"
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible:
      text: "Appearance.*"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "settings-playground"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "settings-playground"
- extendedWaitUntil:
    visible:
      text: "COMPONENTS"
    timeout: 20000
- tapOn:
    id: "playground-open-button"
- extendedWaitUntil:
    visible:
      text: "Button"
    timeout: 20000
- assertVisible:
    text: "RUN ACTION"
- assertNotVisible:
    text: "Playground"
- assertNotVisible:
    text: "Settings"
- tapOn:
    text: "Back to components"
- extendedWaitUntil:
    visible:
      text: "Appearance.*"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "settings-build"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "settings-build"
- extendedWaitUntil:
    visible:
      text: "Build & matrix"
    timeout: 20000
- assertVisible:
    text: "HERMES"
- tapOn:
    text: "CLOSE"
- extendedWaitUntil:
    visible:
      text: "Appearance.*"
    timeout: 20000
