appId: com.rubanlabs.mobile.debug
---
# The iOS 18 simulator does not reliably relaunch a stopped app through
# Maestro custom-scheme action or deliver taps to the custom icon-only tab.
# The CI harness opens ruban-debug://settings through simctl after the separate
# cold-launch flow. A fresh simulator asks for system confirmation the first
# time it opens the custom scheme, while a reused simulator does not.
- tapOn:
    text: "^(Open|打开)$"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Appearance.*"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "settings-playground"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "settings-playground"
- extendedWaitUntil:
    visible:
      text: "COMPONENTS"
    timeout: 20000
- tapOn:
    id: "playground-open-button"
- extendedWaitUntil:
    visible:
      text: "Button"
    timeout: 20000
- assertVisible:
    text: "RUN ACTION"
- assertNotVisible:
    text: "Playground"
- assertNotVisible:
    text: "Settings"
- tapOn:
    text: "Back to components"
- extendedWaitUntil:
    visible:
      text: "Appearance.*"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "settings-build"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "settings-build"
- extendedWaitUntil:
    visible:
      text: "Build & matrix"
    timeout: 20000
- assertVisible:
    text: "HERMES"
- tapOn:
    text: "CLOSE"
- extendedWaitUntil:
    visible:
      text: "Appearance.*"
    timeout: 20000
