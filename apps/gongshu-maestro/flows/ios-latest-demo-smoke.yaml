appId: com.rubanlabs.mobile.debug
---
# Gongshu app-shell smoke (ios, era latest). Maestro 2.x syntax.
# Text-based selectors on purpose: RN exposes testID to the automation
# hierarchy inconsistently across eras/architectures (Paper vs Fabric).
# User-facing copy and explicit accessibility labels form the stable contract.
- launchApp:
    clearState: true
- setOrientation: portrait
- extendedWaitUntil:
    visible:
      text: "Library"
    timeout: 120000
- assertVisible:
    text: "01.*Button.*"
- assertVisible:
    text: "Playground"
- tapOn:
    text: "01.*Button.*"
- extendedWaitUntil:
    visible:
      text: "Back to components"
    timeout: 20000
- assertNotVisible:
    text: "Playground"
- assertNotVisible:
    text: "Settings"
- tapOn:
    text: "Back to components"
- extendedWaitUntil:
    visible:
      text: "Library"
    timeout: 20000
- openLink: "ruban-debug://components/badge?theme=light&variant=live&size=md"
- extendedWaitUntil:
    visible:
      text: "Open"
    timeout: 180000
- tapOn:
    text: "Open"
- extendedWaitUntil:
    visible:
      text: "Back to components"
    timeout: 120000
- assertVisible:
    text: "LIVE"
- openLink: "ruban-debug://components/separator?theme=dark&orientation=vertical&tone=accent&weight=bold"
- extendedWaitUntil:
    visible:
      text: "Live separator vertical accent bold"
    timeout: 60000
- assertVisible:
    text: "VERTICAL"
- assertVisible:
    text: "Live separator vertical accent bold"
- openLink: "ruban-debug://components/switch?theme=light&state=on&size=md"
- extendedWaitUntil:
    visible:
      text: "Live switch state ON"
    timeout: 60000
- assertVisible:
    text: "CONTROL"
- assertVisible:
    text: "Live switch state ON"
- tapOn:
    text: "Live switch"
- assertVisible:
    text: "Live switch state OFF"
- openLink: "ruban-debug://home"
- extendedWaitUntil:
    visible:
      text: "Library"
    timeout: 20000
- tapOn:
    text: "Playground"
- extendedWaitUntil:
    visible:
      text: "PLAYGROUND"
    timeout: 20000
- assertVisible:
    text: "LIGHT"
- assertVisible:
    text: "TYPE"
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 20000
- assertVisible:
    text: "Appearance.*"
- scrollUntilVisible:
    element:
      text: "Build & matrix.*"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Build & matrix.*"
- extendedWaitUntil:
    visible:
      text: "Build & Matrix"
    timeout: 20000
- assertVisible:
    text: "HERMES"
- tapOn:
    text: "CLOSE"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 20000
