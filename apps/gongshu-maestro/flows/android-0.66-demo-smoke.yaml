appId: com.rubanlabs.mobile.gongshu.rn066.debug
---
# Gongshu app-shell smoke (android, era 0.66). Maestro 2.x syntax.
# Text-based selectors on purpose: RN exposes testID to the automation
# hierarchy inconsistently across eras/architectures (Paper vs Fabric).
# User-facing copy and explicit accessibility labels form the stable contract.
- launchApp:
    clearState: true
- setOrientation: portrait
- extendedWaitUntil:
    visible:
      text: "Components"
    timeout: 60000
- assertVisible:
    text: "Button"
- assertVisible:
    text: "Playground"
- tapOn:
    text: "Button"
- extendedWaitUntil:
    visible:
      text: "Back to components"
    timeout: 20000
- assertNotVisible:
    text: "Playground"
- assertNotVisible:
    text: "Settings"
- tapOn:
    text: "Back to components"
- extendedWaitUntil:
    visible:
      text: "Components"
    timeout: 20000
- openLink: "ruban-rn066-debug://components/badge?theme=light&variant=live&size=md"
- extendedWaitUntil:
    visible:
      text: "Badge"
    timeout: 20000
- assertVisible:
    text: "LIVE"
- openLink: "ruban-rn066-debug://components/separator?theme=dark&orientation=vertical&tone=accent&weight=bold"
- extendedWaitUntil:
    visible:
      text: "Separator"
    timeout: 20000
- assertVisible:
    text: "VERTICAL"
- assertVisible:
    text: "Live separator vertical accent bold"
- openLink: "ruban-rn066-debug://components/switch?theme=light&state=on&size=md"
- extendedWaitUntil:
    visible:
      text: "Switch"
    timeout: 20000
- assertVisible:
    text: "CONTROL"
- assertVisible:
    text: "Live switch state ON"
- tapOn:
    text: "Live switch"
- assertVisible:
    text: "Live switch state OFF"
- openLink: "ruban-rn066-debug://components/dialog?theme=light&scenario=sequential"
- extendedWaitUntil:
    visible:
      text: "FIRST DIALOG"
    timeout: 20000
- tapOn:
    text: "NEXT DIALOG"
- extendedWaitUntil:
    visible:
      text: "SECOND DIALOG"
    timeout: 20000
- assertNotVisible:
    text: "FIRST DIALOG"
- tapOn:
    text: "DONE"
- openLink: "ruban-rn066-debug://components/dialog?theme=dark&scenario=nested"
- extendedWaitUntil:
    visible:
      text: "PARENT DIALOG"
    timeout: 20000
- tapOn:
    text: "OPEN CONFIRMATION"
- extendedWaitUntil:
    visible:
      text: "CONFIRM ACTION"
    timeout: 20000
- tapOn:
    text: "RETURN TO PARENT"
- extendedWaitUntil:
    visible:
      text: "PARENT DIALOG"
    timeout: 20000
- tapOn:
    text: "CLOSE"
- openLink: "ruban-rn066-debug://components/dialog?theme=light&scenario=external"
- extendedWaitUntil:
    visible:
      text: "RELEASE GATE"
    timeout: 20000
- assertNotVisible:
    text: "GATED DIALOG"
- tapOn:
    text: "RELEASE GATE"
- extendedWaitUntil:
    visible:
      text: "GATED DIALOG"
    timeout: 20000
- tapOn:
    text: "DONE"
- openLink: "ruban-rn066-debug://home"
- extendedWaitUntil:
    visible:
      text: "Components"
    timeout: 20000
- tapOn:
    text: "Playground"
- extendedWaitUntil:
    visible:
      text: "PLAYGROUND"
    timeout: 20000
- assertVisible:
    text: "LIGHT"
- assertVisible:
    text: "TYPE"
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 20000
- assertVisible:
    text: "Appearance"
- scrollUntilVisible:
    element:
      text: "Build & matrix.*"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Build & matrix.*"
- extendedWaitUntil:
    visible:
      text: "Build & Matrix"
    timeout: 20000
- assertVisible:
    text: "HERMES"
- tapOn:
    text: "CLOSE"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 20000
