appId: com.rubanlabs.mobile.gongshu.rn066.debug
---
# Cold-launch phase for iOS. The CI harness follows this with a system-level
# custom-scheme open and a separate permission-handshake flow.
- launchApp:
    clearState: true
- setOrientation: portrait
- extendedWaitUntil:
    visible:
      text: "Components"
    timeout: 120000
- assertVisible:
    text: "01.*Button.*"
- assertVisible:
    text: "Playground"
