apply plugin: 'com.android.library'

def safeExtGet = rootProject.ext.has('safeExtGet')
  ? rootProject.ext.safeExtGet
  : { name, fallback -> rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback }

android {
  compileSdkVersion safeExtGet('compileSdkVersion', 35)

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 21)
    targetSdkVersion safeExtGet('targetSdkVersion', 35)
    versionCode 1
    versionName '0.1.0'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  def reactNativeAndroidDir = rootProject.file('../node_modules/react-native/android')
  if (new File(reactNativeAndroidDir, 'com/facebook/react/react-android').exists()) {
    // React Native 0.71+ supplies this artifact through its Gradle plugin.
    implementation 'com.facebook.react:react-android'
  } else {
    // React Native 0.66 keeps the legacy Maven artifact.
    implementation 'com.facebook.react:react-native:+'
  }
}
