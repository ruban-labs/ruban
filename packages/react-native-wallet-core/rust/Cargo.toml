[package]
name = "ruban-wallet-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
alloy-consensus = "2.4.1"
alloy-dyn-abi = { version = "1.7.2", features = ["eip712"] }
alloy-network = "2.4.1"
alloy-primitives = "1.7.2"
alloy-signer = "2.4.1"
alloy-signer-local = { version = "2.4.1", features = ["mnemonic", "zeroize"] }
bip39 = { version = "2.2.2", features = ["rand", "zeroize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
zeroize = { version = "1.8.2", features = ["derive"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
