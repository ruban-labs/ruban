name: pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - brand/ruban-app-icon-dark.svg
      - brand/ruban-lockup-horizontal.svg
      - design/theme-colors.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/design/generate-theme-colors.mjs
      - scripts/site/check.mjs
      - website/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm site:check

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
