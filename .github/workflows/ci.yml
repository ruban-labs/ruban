name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      verify: ${{ steps.scope.outputs.verify }}
      site: ${{ steps.scope.outputs.site }}
      typecheck: ${{ steps.scope.outputs.typecheck }}
      bundle: ${{ steps.scope.outputs.bundle }}
      ios: ${{ steps.scope.outputs.ios }}
      typecheck_matrix: ${{ steps.scope.outputs.typecheck_matrix }}
      bundle_matrix: ${{ steps.scope.outputs.bundle_matrix }}
      ios_matrix: ${{ steps.scope.outputs.ios_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node --test scripts/ci/changed-scope.test.mjs
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/changed-scope.mjs

  verify:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Report selected scope
        run: |
          echo "full=${{ needs.changes.outputs.full }}"
          echo "verify=${{ needs.changes.outputs.verify }}"
          echo "site=${{ needs.changes.outputs.site }}"
      - uses: actions/checkout@v4
        if: needs.changes.outputs.verify == 'true' || (needs.changes.outputs.site == 'true' && github.event_name != 'push')
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.verify == 'true' || (needs.changes.outputs.site == 'true' && github.event_name != 'push')
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.verify == 'true' || (needs.changes.outputs.site == 'true' && github.event_name != 'push')
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain
        if: needs.changes.outputs.verify == 'true'
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Restore Rust cache
        if: needs.changes.outputs.verify == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/rust-target
          key: rust-${{ runner.os }}-${{ hashFiles('packages/react-native-wallet-core/rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - if: needs.changes.outputs.verify == 'true' || (needs.changes.outputs.site == 'true' && github.event_name != 'push')
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.verify == 'true'
        run: pnpm -r typecheck
      - if: needs.changes.outputs.verify == 'true'
        run: pnpm -r test
      - if: needs.changes.outputs.verify == 'true'
        run: pnpm -r build
      - name: Source registry drift
        if: needs.changes.outputs.verify == 'true'
        run: pnpm registry:check
      - name: UI dependency graph
        if: needs.changes.outputs.verify == 'true'
        run: pnpm design:ui-graph:check
      - name: Published package contract
        if: needs.changes.outputs.verify == 'true'
        run: pnpm check:packages
      - name: Layer 1 - syntax floor (ES2019)
        if: needs.changes.outputs.verify == 'true'
        run: node scripts/ci/check-syntax-floor.mjs
      - name: Website check
        if: needs.changes.outputs.site == 'true' && github.event_name != 'push'
        run: pnpm site:check
      - name: No package verification required
        if: needs.changes.outputs.verify != 'true' && (needs.changes.outputs.site != 'true' || github.event_name == 'push')
        run: echo "The changed paths do not affect package or native build outputs."

  typecheck-matrix:
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.typecheck_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Switch to era Node ${{ matrix.era-node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.era-node }}
      - name: Layer 2 - consumer typecheck (${{ matrix.fixture }})
        run: node scripts/ci/typecheck-matrix.mjs --fixture ${{ matrix.fixture }}

  bundle-smoke:
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.bundle_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Layer 4 - pack tarball
        run: node scripts/ci/bundle-smoke.mjs pack --era ${{ matrix.era }}
      - name: Switch to era Node ${{ matrix.era-node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.era-node }}
      - name: Layer 4 - init template app and install
        run: node scripts/ci/bundle-smoke.mjs app --era ${{ matrix.era }}
      - name: Layer 4 - metro bundle
        run: node scripts/ci/bundle-smoke.mjs bundle --era ${{ matrix.era }}

  ios-smoke:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.ios_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode inventory
        run: ls -d /Applications/Xcode*.app
      - name: Select oldest Xcode
        if: matrix.xcode == 'oldest'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_[0-9]*.app | sort -V | head -1)"
      - name: Download simulator runtime for selected Xcode
        if: matrix.xcode == 'oldest'
        run: sudo xcodebuild -downloadPlatform iOS
      - name: Xcode version
        run: xcodebuild -version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Restore Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/rust-target
          key: rust-${{ runner.os }}-${{ hashFiles('packages/react-native-wallet-core/rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Switch to era Node ${{ matrix.era-node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.era-node }}
      - name: Sync app (demo + tarball + deps)
        run: node scripts/dev/sync-gongshu.mjs --app ${{ matrix.app }} --native-platform ios
      - name: Patch 0.66 era compat (boost mirror + yoga bool-bitwise)
        if: matrix.era == '0.66'
        working-directory: apps/${{ matrix.app }}
        run: |
          perl -pi -e 's|https://boostorg\.jfrog\.io/artifactory/main/release/1\.76\.0/source/boost_1_76_0\.tar\.bz2|https://archives.boost.io/release/1.76.0/source/boost_1_76_0.tar.bz2|' \
            node_modules/react-native/third-party-podspecs/boost.podspec
          # Xcode 15 -Werror: bool | bool in yoga (upstream fixed later)
          perl -pi -e 's/hadOverflow\(\) \|$/hadOverflow() ||/' \
            node_modules/react-native/ReactCommon/yoga/yoga/Yoga.cpp
          grep -c 'hadOverflow() ||' node_modules/react-native/ReactCommon/yoga/yoga/Yoga.cpp
      - name: Pod install
        working-directory: apps/${{ matrix.app }}/ios
        env:
          NO_FLIPPER: ${{ matrix.era == '0.66' && '1' || '0' }}
        run: pod install
      - name: Patch 0.66 boost hash for C++17 (Xcode 15 libc++)
        if: matrix.era == '0.66'
        working-directory: apps/${{ matrix.app }}/ios
        run: |
          perl -pi -e 's/ : std::unary_function<T, std::size_t>//g' Pods/boost/boost/container_hash/hash.hpp
          grep -c "struct hash_base {};" Pods/boost/boost/container_hash/hash.hpp
      - name: Pick first available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          udid = next(dev['udid'] for rt in d['devices'].values() for dev in rt if dev['name'].startswith('iPhone') and dev['isAvailable'])
          print(udid)")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build (simulator)
        working-directory: apps/${{ matrix.app }}/ios
        run: |
          xcodebuild -workspace ${{ matrix.proj }}.xcworkspace \
            -scheme ${{ matrix.proj }} \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            build
      - name: Boot simulator and install app
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" \
            "apps/${{ matrix.app }}/ios/build/Build/Products/Debug-iphonesimulator/${{ matrix.proj }}.app"
      - name: Start Metro
        working-directory: apps/${{ matrix.app }}
        run: |
          nohup env ${{ matrix.metro-env }} corepack pnpm exec react-native start --port 8081 > /tmp/metro.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://localhost:8081/status | grep -q packager-status && break
            sleep 2
          done
          curl -s http://localhost:8081/status
          echo "Prewarming first bundle (cold transform can take minutes)..."
          curl -s --max-time 300 "http://localhost:8081/index.bundle?platform=ios&dev=true" -o /dev/null
          echo "Bundle prewarmed"
      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=2.5.1
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: Run flow
        working-directory: apps/gongshu-maestro
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          set +e
          maestro test flows/ios-${{ matrix.era }}-demo-smoke.yaml
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if find "$HOME/.maestro/tests" -type f -name 'commands*.json' -print -quit | grep -q .; then
            exit "$status"
          fi

          echo "::warning::Maestro XCTest driver did not reach flow execution; rebooting the simulator and retrying once."
          xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl boot "${{ steps.sim.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          maestro test flows/ios-${{ matrix.era }}-demo-smoke.yaml
      - name: Metro log on failure
        if: failure()
        run: tail -80 /tmp/metro.log || true
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.era }}-debug
          path: |
            /tmp/metro.log
            /Users/runner/.maestro/tests
          if-no-files-found: ignore
          include-hidden-files: true

  ci-summary:
    if: always()
    needs:
      - changes
      - verify
      - typecheck-matrix
      - bundle-smoke
      - ios-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck-matrix.result }}
          BUNDLE_RESULT: ${{ needs.bundle-smoke.result }}
          IOS_RESULT: ${{ needs.ios-smoke.result }}
        run: |
          for result in "$CHANGES_RESULT" "$VERIFY_RESULT" "$TYPECHECK_RESULT" "$BUNDLE_RESULT" "$IOS_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A selected CI job ended with: $result"
              exit 1
            fi
          done
